<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 💖</title>
    <style>
        body {
            /* ဒီနေရာမှာ ဆရာမ လိုချင်တဲ့ နောက်ခံပုံရဲ့ Link ကို ထည့်ပါ */
            background-image: url('https://ဆရာမ လိုချင်တဲ့ပုံရဲ့ Link');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pyidaungsu', sans-serif;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 20px;
            color: white;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎂 Happy Birthday ချစ်ချစ် 💖</h1>
        <p>မောင်ခန့်ရဲ့ ချစ်ခြင်းတွေနဲ့ ပြည့်နှက်နေတဲ့ မွေးနေ့လေး ဖြစ်ပါစေ 🥰</p>
    </div>
</body>
</html>
